name: API Contract (Postman)

# Boots a full Fleetbase stack (published image) and runs the Core API Postman
# collection against the live API. Delegates to the reusable workflow in
# fleetbase/fleetbase. Requires org secrets POSTMAN_API_KEY + _GITHUB_AUTH_TOKEN
# (inherited); no-ops until POSTMAN_API_KEY is set.
#
# Deliberately unpinned. The reusable workflow defaults to booting fleetbase/fleetbase@main
# against fleetbase/fleetbase-api:latest, so every release is picked up automatically and
# there is no ref here to remember to bump. Each run records the image digest it actually
# resolved in its job summary, so a result stays traceable. To reproduce an older run:
#
#   with:
#     fleetbase-ref: v0.7.53
#     api-image: fleetbase/fleetbase-api:v0.7.53

# Pushes run only for main. A release or dev branch always has a pull request, and
# pull_request already runs on every push to it; triggering on push too ran the
# ~11-minute contract twice for each commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'dev-v*', 'release/v*']
  workflow_dispatch:

# A newer push to the same pull request or branch makes the running contract stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  contract:
    # Laravel 12 release only: revert this job to `@main` with no stack once v2.0.0 ships.
    # The published image is Laravel 10 and its extensions require core-api 1.x, so this
    # branch can only resolve against the whole Laravel 12 train. The `l12` stack builds the
    # image from fleetbase's Laravel 12 branch and links every extension's Laravel 12 branch.
    # Point `uses` and `stack-ref` at `main` once fleetbase/fleetbase's contract-stack change
    # merges there.
    uses: fleetbase/fleetbase/.github/workflows/api-contract.yml@ci/contract-stack
    with:
      collections: "Fleetbase Core API"
      stack: l12
      stack-ref: ci/contract-stack
      build-from-source: false
      # Without this the run tests the version of fleetbase/core-api baked into the
      # published image, not the branch under review. The workflow checks this
      # repository out at the commit under test and swaps it into the container.
      overlay-package: fleetbase/core-api
    secrets: inherit
